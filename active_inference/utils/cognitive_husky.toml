# Cognitive stack for the Husky A300 in the agricultural worlds (plan.md, F4).
#   python3 cognitive.py cognitive_husky.toml
# Assumes the sensorimotor layer is up (python3 subcognitive.py sub_husky.toml) and Webots has a
# webots-agri world open. Every cwd points inside this repo.
#
# Order follows the DSR dependency graph:
#   robot_concept (bootstraps the graph from husky.json) -> openfield_concept (GPS+IMU+wheels pose,
#   the room_concept replacement, publishes the `field` node) -> residual -> controller (last).

[[components]]
name = "robot_concept"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/robot_concept"
cmd  = "bin/robot_concept etc/config_husky.toml"

[[components]]
name = "openfield_concept"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/openfield_concept"
cmd  = "bin/openfield_concept etc/config.toml"   # GPS+IMU+wheels EKF -> field node + robot->field RT

# Null-hypothesis safety layer: every LiDAR/ZED return no concept explains becomes occupancy (the palms,
# for now — there is no agricultural concept yet). Needs openfield_concept's `field` node.
[[components]]
name = "residual"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/residual_concept"
cmd  = "bin/residual_concept etc/config_husky.toml"

# Last: plans on the field polygon + residual's occupancy and drives the base (click a goal in its 2D view).
[[components]]
name = "controller"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/controller"
cmd  = "bin/controller etc/config_husky.toml"

# Plants: retina's ADE20K vegetation masks -> one `plant` node (canopy disc) per plant, in the field frame.
# residual counts their returns as explained, the controller plans around their discs, and human_concept
# knows no person stands inside one. Needs retina (masks) and openfield_concept's `field` node.
[[components]]
name = "vegetation_concept"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/vegetation_concept"
cmd  = "bin/vegetation_concept etc/config.toml"

# Trunks: the ZED's ADE20K 'tree' masks in the band below the canopy, confirmed by the helios -> one trunk_*
# `plant` node per trunk, a forbidden disc (r 0.6 m) the controller plans around. Permanent until the camera
# verifies it gone (looking, unoccluded by foliage or people). Needs retina, openfield_concept's `field`.
[[components]]
name = "trunk_concept"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/trunk_concept"
cmd  = "bin/trunk_concept etc/config.toml"

# Rows: field -> trunks -> row. Trunks on a line form a row, a rectangle that grows as trunks join it; one
# `metaconcept` node row_<id> per row with a group_member edge to each trunk. The controller marks the rows.
# DISABLED for now (2026-10-14): without it the controller marks every trunk with its own disc. Uncomment to enable.
# [[components]]
# name = "row_metaconcept"
# cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/row_metaconcept"
# cmd  = "bin/row_metaconcept etc/config.toml"

# People (part 1 of retina in the field): ZED -> YOLO-seg + YOLO-pose -> 'masks' and 'skeleton' nodes.
[[components]]
name = "retina"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/retina"
cmd  = "bin/retina etc/config_husky.toml"

# BODY_18 skeletons from retina -> one person_* node per tracked person, placed in the field frame.
[[components]]
name = "human_concept"
cwd  = "~/robocomp/AiGB_UEx_Navigation/active_inference/human_concept"
cmd  = "bin/human_concept etc/config.toml"
