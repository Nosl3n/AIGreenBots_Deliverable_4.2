# trunk_concept — the trunks of the field as `plant` nodes named trunk_* (ZED 'tree' band + helios).
# See src/specificworker.h for the contract and src/trunk_map.h for the model.

[Proxies]
# No required Ice interfaces (DSR is the comms plane).

[Agent]
id = 27   # MUST be unique across the shared graph: robot=6 controller=8 retina=9 human=13 residual=14 openfield=25
          # vegetation=26. A collision = CRDT actor-id clash -> SIGSEGV.
name = "trunk_concept"
configFile = ""
domain = 0
tree = false
graph = false
"2d" = false
"3d" = false

[Period]
Compute = 50        # 20 Hz: drains the masks node and the helios plane
Emergency = 500

[Component.Debug]
Verbose = false

[Ice]
Warn.Connections = "0"
Trace.Network = "0"
Trace.Protocol = "0"
MessageSizeMax = "20004800"

[Presence]
required_agent_names = ["robot_concept", "retina"]
optional_agent_names = ["openfield_concept", "vegetation_concept", "human_concept", "residual_concept", "controller"]
config_dir = "etc"
monitor_period_ms = 500
heartbeat_timeout_ms = 15000
rejoin_grace_ms = 5000
stale_grace_ms = 120000
agent_info_period_ms = 1000

[Owns]
nodes = ["trunk_concept 27", "trunk_*"]

[Trunk]
PlantRadiusM = 0.5        # the forbidden disc around a trunk (2.5 m rows: leaves 0.75 m to the corridor centre line)
TrunkHeightM = 0.6        # published height_m: the trunk, not the canopy
PersonRadiusM = 0.4       # a person as an occluder of the camera's view
# The trunk band: 'tree' pixels between the ground/beds and the first branch. MEASURED in husky_apple.wbt:
# 93.5% of 'tree' points in 0.30-0.55 m lie within 0.12 m of a real trunk (99.2% within 0.25 m).
BandZMinM = 0.30
BandZMaxM = 0.55
ClusterRadiusM = 0.15     # a trunk + its stake
BirthMass = 8.0           # cell-frames of band evidence before the LiDAR is asked to confirm. ★PER REFERENCE LOOK,
                          # like LlrHit/LlrMiss: each ZED look weighs min(1, time since the previous look /
                          # LookPeriodMs), so the evidence per second does not depend on retina's semantic rate
                          # (decimation 1, the model size, TensorRT). 530 ms = the ~1.9 looks/s these were tuned at.
LookPeriodMs = 530
LlrHit = 1.0              # log-odds per reference look the trunk is seen
LlrMiss = -0.6            # ... per unoccluded in-view reference look it is not, before p_vis weighting
LidarConfirmPoints = 3    # helios band returns on the candidate IN ONE SWEEP: the multimodal birth ...
LidarConfirmDzM = 0.08    # ... spread over this much height (a trunk is vertical; ground noise grazing the band is not)
AssocGateM = 0.25
MinSeparationM = 0.75     # two trunks cannot stand closer (planting distance here 1.25 m). At 0.5 the tips of fruit-laden
                          # low branches, which droop into the band ~0.6 m from their trunk, were born as trunks
RemovalProb = 0.1         # removed once P(exists) < 0.1 — only from unoccluded, in-view looks
ZedMaxRangeM = 4.0        # absence is charged only this close: a 7 cm trunk is ~7 px at 5 m, and the mask's 5 px
                          # morphological opening (retina [Semantic].mask_morph_kernel) erases it beyond that
ZedMinRangeM = 1.0        # ... and not closer: the band can fall below the image
ZedHalfFovRad = 0.85
TrunkLabels = ["tree", "palm"]                        # ADE20K classes that have a trunk
VegetationLabels = ["tree", "plant", "palm", "flower"] # any of them on a frame = the semantic model ran (a real look)
UpdatePeriodMs = 500
LidarEvery = 2
MasksStallTimeoutMs = 5000

[Ablation]
# Switches for the E4 ablations (experiments/README.md). Both true = the normal model; leave them so.
LidarConfirm = true       # false: a ZED (semantic) candidate becomes a trunk without the LiDAR confirming it
VisibilityModel = true    # false: absence charged on every in-view look (no occlusion test, no range p_vis)
