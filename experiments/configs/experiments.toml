# Experiment definitions (experiments/README.md). One table per experiment; each VARIANT is only a set of overrides
#   [EX.variants.<variant>.<component>]  "Section.Key" = value
# applied to COPIES of that component's config for that run. The repo configs are never touched, so with no
# overlay every switch keeps its default (= the normal behaviour of the stack). "{seed}" is replaced by the run seed.
#
# Keys per experiment:
#   description, world (husky_apple | exp_* in experiments/worlds), stack ("full" | "localization"),
#   exclude = [components left out], driver ("route" = utils/run_route.py through the controller,
#   "gt" = scripts/gt_driver.py on the simulator's ground truth, "none"), route = "x,y x,y ...", duration_s,
#   warmup_s (after every agent is Operating), screenshots_s (with --screenshots).

[common.overrides]
# Nothing global: every run starts from the configs the stack normally uses.

# ── E1: localization with degraded GNSS (bridge degradation layer + EKF variants run side by side) ──────────────
# The four configurations are run AT ONCE on the same data (openfield [Experiment] ShadowFilters): A = current EKF,
# B = receiver sigma + Student-t + latency compensation, C = no GNSS after initialisation, D = no IMU yaw.
# Every run drives the SAME path on the simulator's ground truth (scripts/gt_driver.py). The x = 3.75 corridor
# section y in [-2, 6] is a declared no-GNSS zone.
[E1]
description = "Localization with degraded GNSS: current EKF / receiver R + Student-t / no GNSS / no IMU yaw"
world = "husky_apple"
stack = "localization"
driver = "gt"
route = "1.25,-10.5 1.25,8.5 3.75,8.5 3.75,-9.5 -1.25,-9.5 -1.25,8.5"
speed = 0.6
duration_s = 240
warmup_s = 10
operating_wait_s = 90
[E1.overrides.bridge]
"GnssDegradation.StatusFile" = "/dev/shm/aigb_gnss_status"
[E1.overrides.robot_concept]
"Media.enable_zed" = false      # E1 runs no perception: do not relay camera / LiDAR through robot_concept
"Media.enable_lidar" = false
[E1.overrides.openfield_concept]
"Gps.StatusFile" = "/dev/shm/aigb_gnss_status"
"Experiment.ShadowFilters" = true
"Diag.ExperimentCsv" = "tmp/exp_e1.csv"
"Viewer.Enabled" = false
[E1.variants.degraded.bridge]
"GnssDegradation.Enabled" = true
"GnssDegradation.Seed" = "{seed}"
"GnssDegradation.LatencyMs" = 200.0
"GnssDegradation.OutageRatePerMin" = 0.5
"GnssDegradation.DeniedZones" = "3.0 -2.0 4.5 6.0"
[E1.variants.clean.bridge]
"GnssDegradation.Enabled" = false

# ── E2: people tracking. Variants: ZED + LiDAR (fused) and ZED only ──────────────────────────────────────────────
[E2]
description = "People tracking: crossings, occlusion by vegetation, behind the robot. MOTA/MOTP/IDSW"
world = "exp_people"
stack = "full"
driver = "route"
route = "-1.25,-10 -1.25,7.5 -1.25,-10 3.75,-10.3 -3.75,-10.3 -1.25,-10 -1.25,7.5 -1.25,-10"
timeout_waypoint_s = 150
duration_s = 900
warmup_s = 15
[E2.variants.fusion]
[E2.variants.zed_only.human_concept]
"HumanLidar.Enabled" = false

# ── E3: trunk map, and the two ablations that show what each modality buys ─────────────────────────────────────
# The base runs are the E4 missions (same configuration); this table only adds the ablations.
[E3]
description = "Trunk map: precision/recall/F1 against the world's ground truth; ablations"
world = "husky_apple"
stack = "full"
driver = "route"
route = "3.75,-9.5 3.75,8 3.75,-9.5 -1.25,-9.5 -1.25,8 -1.25,-9.5 -3.75,-9.5 -3.75,8 -3.75,-9.5"
timeout_waypoint_s = 150
duration_s = 1500
warmup_s = 15
[E3.variants.base]
[E3.variants.no_lidar_confirm.trunk_concept]
"Ablation.LidarConfirm" = false        # a trunk is born from the ZED (semantic) candidate alone
[E3.variants.no_pvis.trunk_concept]
"Ablation.VisibilityModel" = false     # absence charged on EVERY in-view look: no occlusion test, no range p_vis

# ── E4: integrated navigation (also the base of E3 and E5) ──────────────────────────────────────────────────────
# Out and back along three corridors (the default route of utils/run_route.py), workers walking.
[E4]
description = "Integrated navigation: out-and-back mission along the corridors with workers walking"
world = "husky_apple"
stack = "full"
driver = "route"
route = "3.75,-9.5 3.75,8 3.75,-9.5 -1.25,-9.5 -1.25,8 -1.25,-9.5 -3.75,-9.5 -3.75,8 -3.75,-9.5"
timeout_waypoint_s = 150
duration_s = 1500
warmup_s = 15
screenshots_s = [40, 100, 170]
[E4.variants.base]

# ── E5: computational performance; the second variant forces the semantic model to a lower rate ──────────────
[E5]
description = "Performance: rates, latencies, CPU/GPU per agent; E3 repeated with the semantic model at a lower rate"
world = "husky_apple"
stack = "full"
driver = "route"
route = "3.75,-9.5 3.75,8 3.75,-9.5 -1.25,-9.5 -1.25,8 -1.25,-9.5 -3.75,-9.5 -3.75,8 -3.75,-9.5"
timeout_waypoint_s = 150
duration_s = 1500
warmup_s = 15
[E5.variants.base]
[E5.variants.slow_semantic.retina]
"Semantic.decimation" = 4              # the ADE20K model on one frame in four
